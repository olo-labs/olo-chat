# Build and push olo-chat to Docker Hub (+ GHCR)
# Repo secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Pull: docker pull <DOCKERHUB_USERNAME>/olo-chat:<library-version>  e.g. docker pull ololab/olo-chat:1.0.0
name: Publish Docker image

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to registry'
        required: false
        default: true
        type: boolean

env:
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: olo-chat

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Verify Docker Hub secrets
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::Add repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish to Docker Hub."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve library version
        id: version
        run: |
          LIB_VERSION=$(node -p "require('./package.json').version")
          if [ -z "$LIB_VERSION" ]; then
            echo "::error::Could not read version from package.json"
            exit 1
          fi
          echo "id=$LIB_VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing with library version: $LIB_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (Docker Hub)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}

      - name: Docker metadata (GHCR)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.push
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.id }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.push }}
          tags: |
            ${{ steps.meta-dockerhub.outputs.tags }}
            ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'http://localhost:7080' }}
            VITE_WS_ACCESS_TOKEN=${{ secrets.VITE_WS_ACCESS_TOKEN }}
            VITE_WS_PING_INTERVAL_SEC=${{ vars.VITE_WS_PING_INTERVAL_SEC || '10' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
